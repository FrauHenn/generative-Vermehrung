<style>
* {
    box-sizing: border-box;
}

html {
    -webkit-text-size-adjust: 100%;
}

body {
    margin: 0;
    padding: 14px;
    font-family: Arial, Helvetica, sans-serif;
    background: #fffaf7;
    color: #3f3a38;
}

button,
input {
    font-family: inherit;
}

/* Gesamte Übung */
.app {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
}

/* ---------- KOPF ---------- */

.hero {
    background: linear-gradient(135deg, #f8d6d7, #f9e5dc);
    border-radius: 20px;
    padding: 18px 22px;
    position: relative;
    overflow: hidden;
}

.hero::after {
    content: "";
    position: absolute;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: rgba(255,255,255,0.28);
    right: -50px;
    top: -70px;
}

.topline {
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1.4px;
    color: #8a6464;
    text-transform: uppercase;
}

h1 {
    margin: 5px 0 5px;
    font-size: 25px;
    line-height: 1.15;
    color: #533f3f;
}

.subtitle {
    margin: 0;
    font-size: 14px;
    line-height: 1.35;
}

/* ---------- PUNKTE UND FORTSCHRITT ---------- */

.info-row {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-top: 13px;
}

.points {
    background: white;
    border-radius: 13px;
    padding: 7px 15px;
    min-width: 90px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.points-label {
    display: block;
    font-size: 10px;
    font-weight: bold;
    color: #8d7a73;
    text-transform: uppercase;
}

.points-number {
    font-size: 20px;
    font-weight: bold;
    color: #6f4f4f;
}

.progress-area {
    flex: 1;
}

.progress-text {
    font-size: 11px;
    margin-bottom: 5px;
    color: #735f5a;
    font-weight: bold;
}

.progress-bg {
    height: 8px;
    background: rgba(255,255,255,0.7);
    border-radius: 20px;
    overflow: hidden;
}

.progress {
    height: 100%;
    width: 0%;
    background: #bd7b82;
    border-radius: 20px;
    transition: width .3s;
}

/* ---------- AUFGABENKARTE ---------- */

.card {
    margin-top: 12px;
    background: white;
    border: 1px solid #eaded8;
    border-radius: 20px;
    padding: 20px 22px;
    box-shadow: 0 4px 18px rgba(89,65,55,0.06);
}

.badge {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 20px;
    background: #f5e5dc;
    color: #80635b;
    font-size: 10px;
    font-weight: bold;
    letter-spacing: .5px;
}

.question {
    margin: 12px 0 14px;
    font-size: 20px;
    line-height: 1.25;
    color: #443936;
}

/* ---------- ANTWORTEN ---------- */

.answers {
    display: grid;
    gap: 8px;
}

.answer {
    width: 100%;
    min-height: 48px;
    border: 2px solid #eee4df;
    background: #fffdfc;
    border-radius: 13px;
    padding: 8px 13px;
    text-align: left;
    font-size: 15px;
    cursor: pointer;

    display: flex;
    align-items: center;

    transition:
        background .15s,
        border-color .15s,
        transform .15s;

    touch-action: manipulation;
}

.answer:hover {
    border-color: #d6aaa8;
    background: #fff8f5;
}

.answer:active {
    transform: scale(.99);
}

.answer-letter {
    width: 29px;
    height: 29px;
    min-width: 29px;
    border-radius: 50%;
    background: #f4e5df;
    margin-right: 11px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 13px;
    font-weight: bold;
    color: #755c56;
}

.answer.correct {
    background: #edf8f0;
    border-color: #70a982;
}

.answer.correct .answer-letter {
    background: #70a982;
    color: white;
}

.answer.wrong {
    background: #fff0ef;
    border-color: #d88982;
}

.answer.wrong .answer-letter {
    background: #d88982;
    color: white;
}

.answer:disabled {
    cursor: default;
    opacity: 1;
}

/* ---------- FEEDBACK ---------- */

.feedback {
    margin-top: 10px;
}

.feedback-box {
    border-radius: 12px;
    padding: 10px 14px;
    line-height: 1.35;
    font-size: 14px;
}

.feedback-correct {
    background: #edf8f0;
    border-left: 4px solid #70a982;
}

.feedback-wrong {
    background: #fff2ef;
    border-left: 4px solid #d88982;
}

.feedback-title {
    font-weight: bold;
    margin-bottom: 2px;
}

/* ---------- LÜCKENTEXT ---------- */

.fillbox {
    background: #fbf4ee;
    padding: 15px;
    border-radius: 13px;
    font-size: 17px;
    line-height: 2;
}

.fillbox input {
    font-size: 16px;
    padding: 7px 10px;
    width: 190px;
    max-width: 100%;
    border: 2px solid #d9c2b8;
    border-radius: 9px;
    outline: none;
}

.fillbox input:focus {
    border-color: #bd7b82;
}

/* ---------- REIHENFOLGE ---------- */

.instruction {
    color: #756762;
    margin: 0 0 10px;
    font-size: 14px;
}

.word-pool {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.word {
    min-height: 44px;
    border: 2px solid #e3d2c9;
    background: #fbf3ed;
    border-radius: 11px;
    padding: 8px 13px;
    font-size: 14px;
    cursor: pointer;
    touch-action: manipulation;
}

.word:hover {
    background: #f4e3da;
}

.word.used {
    opacity: .35;
}

.sequence-box {
    margin-top: 12px;
    padding: 12px 14px;
    background: #f7f4ed;
    border-radius: 12px;
}

.sequence-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8c7a71;
    font-weight: bold;
}

.sequence {
    margin-top: 5px;
    min-height: 20px;
    font-size: 14px;
    font-weight: bold;
    line-height: 1.5;
}

/* ---------- BUTTONS ---------- */

.button-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 12px;
}

button.action {
    min-height: 44px;
    border: none;
    background: #bd7b82;
    color: white;
    border-radius: 11px;
    padding: 9px 17px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
}

button.secondary {
    background: #f1e6df;
    color: #654f48;
}

/* ---------- NAVIGATION ---------- */

.navigation {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
}

.navbutton {
    min-height: 46px;
    border: none;
    border-radius: 12px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
}

.restart {
    background: #eee6e1;
    color: #604e48;
}

.next {
    min-width: 125px;
    background: #bd7b82;
    color: white;
}

.next:disabled {
    opacity: .35;
    cursor: not-allowed;
}

/* ---------- ENDERGEBNIS ---------- */

.finish {
    text-align: center;
    padding: 8px 5px;
}

.finish-circle {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    margin: auto;
    background: #e6f3e9;
    color: #56876a;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 30px;
    font-weight: bold;
}

.finish h2 {
    margin: 10px 0 5px;
}

.final-score {
    margin-top: 5px;
    font-size: 34px;
    font-weight: bold;
    color: #6d5050;
}

.finish p {
    margin: 8px 0;
}

.merksatz {
    text-align: left;
    margin-top: 15px;
    padding: 14px 16px;
    border-radius: 13px;
    background: #f7eee7;
    font-size: 14px;
    line-height: 1.45;
}

.merksatz-label {
    font-size: 10px;
    letter-spacing: 1px;
    font-weight: bold;
    color: #8b6e65;
    margin-bottom: 5px;
}


/* =========================================
   iPAD QUERFORMAT
   ========================================= */

@media
(min-width: 700px)
and (max-width: 1200px)
and (orientation: landscape) {

    body {
        padding: 10px 14px;
    }

    .app {
        max-width: 950px;
    }

    .hero {
        padding: 13px 20px;
    }

    h1 {
        font-size: 23px;
    }

    .subtitle {
        font-size: 13px;
    }

    .info-row {
        margin-top: 9px;
    }

    .card {
        margin-top: 9px;
        padding: 16px 20px;
    }

    .question {
        margin: 9px 0 11px;
        font-size: 18px;
    }

    .answers {
        grid-template-columns: 1fr 1fr;
        gap: 8px 10px;
    }

    .answer {
        min-height: 47px;
        font-size: 14px;
    }

    .feedback {
        margin-top: 8px;
    }

    .navigation {
        margin-top: 9px;
    }
}


/* =========================================
   iPAD HOCHFORMAT
   ========================================= */

@media
(min-width: 600px)
and (max-width: 900px)
and (orientation: portrait) {

    body {
        padding: 12px;
    }

    .hero {
        padding: 18px;
    }

    h1 {
        font-size: 24px;
    }

    .card {
        padding: 20px;
    }

    .answer {
        min-height: 52px;
    }
}


/* =========================================
   KLEINE BILDSCHIRME
   ========================================= */

@media (max-width: 599px) {

    body {
        padding: 8px;
    }

    .hero,
    .card {
        border-radius: 16px;
    }

    .hero {
        padding: 16px;
    }

    .card {
        padding: 17px;
    }

    h1 {
        font-size: 22px;
    }

    .question {
        font-size: 18px;
    }

    .info-row {
        gap: 10px;
    }

    .points {
        min-width: 80px;
    }

    .navigation {
        margin-bottom: 15px;
    }
}
</style>
