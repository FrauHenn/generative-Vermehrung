<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wie werden Merkmale weitergegeben?</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 15px 50px;
    font-family: Arial, Helvetica, sans-serif;
    background: #fffaf7;
    color: #3f3a38;
}

.app {
    max-width: 850px;
    margin: auto;
}

/* ---------- KOPF ---------- */

.hero {
    background: linear-gradient(135deg, #f8d6d7, #f9e5dc);
    border-radius: 24px;
    padding: 28px;
    position: relative;
    overflow: hidden;
}

.hero::after {
    content: "";
    position: absolute;
    width: 170px;
    height: 170px;
    border-radius: 50%;
    background: rgba(255,255,255,0.28);
    right: -50px;
    top: -60px;
}

.topline {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 1.5px;
    color: #8a6464;
    text-transform: uppercase;
}

h1 {
    margin: 8px 0 8px;
    font-size: 30px;
    color: #533f3f;
}

.subtitle {
    margin: 0;
    font-size: 16px;
    line-height: 1.5;
}

/* ---------- PUNKTE ---------- */

.info-row {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-top: 22px;
}

.points {
    background: white;
    border-radius: 16px;
    padding: 10px 18px;
    min-width: 100px;
    text-align: center;
    box-shadow: 0 3px 12px rgba(0,0,0,0.06);
}

.points-label {
    display: block;
    font-size: 11px;
    font-weight: bold;
    color: #8d7a73;
    text-transform: uppercase;
}

.points-number {
    font-size: 23px;
    font-weight: bold;
    color: #6f4f4f;
}

/* ---------- FORTSCHRITT ---------- */

.progress-area {
    flex: 1;
}

.progress-text {
    font-size: 12px;
    margin-bottom: 6px;
    color: #735f5a;
    font-weight: bold;
}

.progress-bg {
    height: 10px;
    background: rgba(255,255,255,0.65);
    border-radius: 20px;
    overflow: hidden;
}

.progress {
    height: 100%;
    width: 0%;
    background: #bd7b82;
    border-radius: 20px;
    transition: width .3s;
}

/* ---------- AUFGABENKARTE ---------- */

.card {
    margin-top: 20px;
    background: white;
    border: 1px solid #eaded8;
    border-radius: 24px;
    padding: 30px;
    box-shadow: 0 7px 25px rgba(89,65,55,0.07);
}

.badge {
    display: inline-block;
    padding: 7px 12px;
    border-radius: 20px;
    background: #f5e5dc;
    color: #80635b;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: .5px;
}

.question {
    margin: 20px 0;
    font-size: 22px;
    line-height: 1.35;
    color: #443936;
}

/* ---------- ANTWORTEN ---------- */

.answers {
    display: grid;
    gap: 12px;
}

.answer {
    width: 100%;
    min-height: 58px;
    border: 2px solid #eee4df;
    background: #fffdfc;
    border-radius: 15px;
    padding: 13px 16px;
    text-align: left;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    transition: .15s;
}

.answer:hover {
    border-color: #d6aaa8;
    background: #fff8f5;
    transform: translateY(-1px);
}

.answer-letter {
    width: 32px;
    height: 32px;
    min-width: 32px;
    border-radius: 50%;
    background: #f4e5df;
    margin-right: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    color: #755c56;
}

.answer.correct {
    background: #edf8f0;
    border-color: #70a982;
}

.answer.correct .answer-letter {
    background: #70a982;
    color: white;
}

.answer.wrong {
    background: #fff0ef;
    border-color: #d88982;
}

.answer.wrong .answer-letter {
    background: #d88982;
    color: white;
}

.answer:disabled {
    cursor: default;
}

/* ---------- FEEDBACK ---------- */

.feedback {
    margin-top: 20px;
}

.feedback-box {
    border-radius: 15px;
    padding: 16px 18px;
    line-height: 1.45;
}

.feedback-correct {
    background: #edf8f0;
    border-left: 5px solid #70a982;
}

.feedback-wrong {
    background: #fff2ef;
    border-left: 5px solid #d88982;
}

.feedback-title {
    font-weight: bold;
    margin-bottom: 4px;
}

/* ---------- LÜCKENTEXT ---------- */

.fillbox {
    background: #fbf4ee;
    padding: 20px;
    border-radius: 15px;
    font-size: 18px;
    line-height: 2.2;
}

.fillbox input {
    font-size: 17px;
    padding: 8px 10px;
    width: 190px;
    max-width: 100%;
    border: 2px solid #d9c2b8;
    border-radius: 9px;
    outline: none;
}

.fillbox input:focus {
    border-color: #bd7b82;
}

/* ---------- REIHENFOLGE ---------- */

.instruction {
    color: #756762;
    margin-bottom: 15px;
}

.word-pool {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.word {
    border: 2px solid #e3d2c9;
    background: #fbf3ed;
    border-radius: 13px;
    padding: 11px 15px;
    font-size: 15px;
    cursor: pointer;
}

.word:hover {
    background: #f4e3da;
}

.word.used {
    opacity: .35;
}

.sequence-box {
    margin-top: 18px;
    padding: 18px;
    background: #f7f4ed;
    border-radius: 15px;
}

.sequence-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #8c7a71;
    font-weight: bold;
}

.sequence {
    margin-top: 8px;
    font-weight: bold;
    line-height: 1.7;
}

/* ---------- BUTTONS ---------- */

.button-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 18px;
}

button.action {
    border: none;
    background: #bd7b82;
    color: white;
    border-radius: 12px;
    padding: 12px 19px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button.secondary {
    background: #f1e6df;
    color: #654f48;
}

.navigation {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 18px;
}

.navbutton {
    border: none;
    border-radius: 13px;
    padding: 13px 21px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.restart {
    background: #eee6e1;
    color: #604e48;
}

.next {
    background: #bd7b82;
    color: white;
}

.next:disabled {
    opacity: .35;
    cursor: not-allowed;
}

/* ---------- ENDE ---------- */

.finish {
    text-align: center;
    padding: 20px 5px;
}

.finish-circle {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    margin: auto;
    background: #e6f3e9;
    color: #56876a;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 38px;
    font-weight: bold;
}

.final-score {
    margin-top: 15px;
    font-size: 40px;
    font-weight: bold;
    color: #6d5050;
}

.merksatz {
    text-align: left;
    margin-top: 25px;
    padding: 18px;
    border-radius: 15px;
    background: #f7eee7;
}

.merksatz-label {
    font-size: 11px;
    letter-spacing: 1px;
    font-weight: bold;
    color: #8b6e65;
    margin-bottom: 7px;
}

@media (max-width:600px) {
    body {
        padding: 10px;
    }

    .hero, .card {
        padding: 20px;
    }

    h1 {
        font-size: 25px;
    }

    .question {
        font-size: 19px;
    }

    .info-row {
        align-items: stretch;
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="hero">

        <div class="topline">
            Biologie · Übung
        </div>

        <h1>Wie werden Merkmale weitergegeben?</h1>

        <p class="subtitle">
            Auch dein Gehirn braucht Training –
            mit jeder Übung wirst du stärker!
        </p>

        <div class="info-row">

            <div class="points">
                <span class="points-label">Punkte</span>
                <span class="points-number">
                    <span id="score">0</span> / 7
                </span>
            </div>

            <div class="progress-area">

                <div class="progress-text" id="progressText">
                    Aufgabe 1 von 7
                </div>

                <div class="progress-bg">
                    <div class="progress" id="progress"></div>
                </div>

            </div>

        </div>
    </div>


    <div class="card" id="card"></div>


    <div class="navigation">

        <button class="navbutton restart" id="restart">
            ↻ Neu starten
        </button>

        <button class="navbutton next" id="next" disabled>
            Weiter →
        </button>

    </div>

</div>


<script>

const questions = [

{
    type:"choice",
    category:"Grundwissen",
    question:"Was ist ein Gen?",

    answers:[
        "Ein Abschnitt der Erbsubstanz",
        "Eine ganze Zelle",
        "Ein sichtbares Merkmal",
        "Eine Keimzelle"
    ],

    correct:0,

    explanation:
    "Ein Gen ist ein Abschnitt der Erbsubstanz."
},


{
    type:"fill",
    category:"Erbinformation",
    question:"Vervollständige den Merksatz.",

    explanation:
    "Gene enthalten die Erbinformation für bestimmte Merkmale."
},


{
    type:"choice",
    category:"Weitergabe der Erbinformation",
    question:"Welcher Vorgang findet zuerst statt?",

    answers:[
        "Befruchtung",
        "Bestäubung",
        "Aussaat",
        "Neukombination"
    ],

    correct:1,

    explanation:
    "Zuerst erfolgt die Bestäubung. Danach kann es zur Befruchtung kommen."
},


{
    type:"choice",
    category:"Befruchtung",
    question:"Was passiert bei der Befruchtung?",

    answers:[
        "Zwei Blüten verschmelzen.",
        "Männliche und weibliche Keimzelle verschmelzen.",
        "Zwei Erbsen werden miteinander vermischt.",
        "Die Erbinformation geht verloren."
    ],

    correct:1,

    explanation:
    "Bei der Befruchtung verschmelzen männliche und weibliche Keimzelle."
},


{
    type:"sort",
    category:"Ablauf",
    question:"Bringe die Vorgänge in die richtige Reihenfolge.",

    explanation:
    "Bestäubung → Befruchtung → neue Merkmalskombinationen → Aussaat"
},


{
    type:"choice",
    category:"Denkaufgabe",
    question:
    "Warum können die Nachkommen neue Merkmalskombinationen besitzen?",

    answers:[
        "Weil bei der Befruchtung die Erbinformationen beider Eltern neu kombiniert werden.",
        "Weil sich die Merkmale bei der Aussaat zufällig verändern.",
        "Weil nur ein Elternteil seine Erbinformation weitergibt.",
        "Weil bei der Bestäubung neue Gene entstehen."
    ],

    correct:0,

    explanation:
    "Bei der Befruchtung werden die Erbinformationen beider Eltern neu kombiniert. Dadurch können neue Merkmalskombinationen entstehen."
},


{
    type:"choice",
    category:"Zum Schluss",
    question:
    "Warum können sich Nachkommen von ihren Eltern unterscheiden?",

    answers:[
        "Weil alle Nachkommen genau dieselbe Erbinformation erhalten.",
        "Weil die Erbinformationen beider Eltern neu kombiniert werden.",
        "Weil nur die Umwelt die Merkmale bestimmt.",
        "Weil bei jeder Aussaat automatisch neue Gene entstehen."
    ],

    correct:1,

    explanation:
    "Durch die Neukombination der Erbinformationen beider Eltern können neue Merkmalskombinationen entstehen."
}

];


let current = 0;
let score = 0;
let answered = false;


const card =
document.getElementById("card");

const scoreElement =
document.getElementById("score");

const progress =
document.getElementById("progress");

const progressText =
document.getElementById("progressText");

const next =
document.getElementById("next");

const restart =
document.getElementById("restart");


function updateProgress(){

    progressText.textContent =
    "Aufgabe " + (current + 1) + " von 7";

    progress.style.width =
    ((current + 1) / 7 * 100) + "%";
}


function questionHeader(q){

    return `
        <span class="badge">
            AUFGABE ${current + 1} · ${q.category}
        </span>

        <h2 class="question">
            ${q.question}
        </h2>
    `;
}


function renderQuestion(){

    answered = false;
    next.disabled = true;

    updateProgress();

    const q = questions[current];


    /* MULTIPLE CHOICE */

    if(q.type === "choice"){

        let html = questionHeader(q);

        html += `<div class="answers">`;

        q.answers.forEach((answer,index)=>{

            html += `

            <button class="answer"
                    data-index="${index}">

                <span class="answer-letter">
                    ${String.fromCharCode(65 + index)}
                </span>

                <span>${answer}</span>

            </button>

            `;

        });

        html += `</div>
                 <div class="feedback" id="feedback"></div>`;

        card.innerHTML = html;


        document
        .querySelectorAll(".answer")
        .forEach(button=>{

            button.addEventListener("click",()=>{

                if(answered) return;

                const selected =
                Number(button.dataset.index);

                const correct =
                selected === q.correct;


                document
                .querySelectorAll(".answer")
                .forEach(b=>b.disabled=true);


                if(correct){

                    button.classList.add("correct");

                    score++;
                    scoreElement.textContent = score;

                } else {

                    button.classList.add("wrong");

                    document
                    .querySelectorAll(".answer")
                    [q.correct]
                    .classList.add("correct");

                }


                showFeedback(
                    correct,
                    q.explanation
                );

            });

        });

    }


    /* LÜCKENTEXT */

    if(q.type === "fill"){

        card.innerHTML =

        questionHeader(q) +

        `

        <div class="fillbox">

            Gene enthalten die

            <input
                id="fillInput"
                placeholder="Begriff eingeben">

            für bestimmte Merkmale.

        </div>

        <div class="button-row">

            <button
                class="action"
                id="checkFill">

                Überprüfen

            </button>

        </div>

        <div
            class="feedback"
            id="feedback">
        </div>

        `;


        document
        .getElementById("checkFill")
        .addEventListener("click",()=>{

            if(answered) return;


            const value =
            document
            .getElementById("fillInput")
            .value
            .trim()
            .toLowerCase();


            if(value === ""){

                document
                .getElementById("feedback")
                .innerHTML =
                "<p>Trage zuerst einen Begriff ein.</p>";

                return;
            }


            const correct =
            value === "erbinformation" ||
            value === "erbinformationen";


            if(correct){

                score++;
                scoreElement.textContent = score;

            }


            showFeedback(
                correct,
                q.explanation
            );

        });

    }


    /* REIHENFOLGE */

    if(q.type === "sort"){

        const words = [

            "Aussaat",

            "Befruchtung",

            "Neue Merkmalskombinationen",

            "Bestäubung"

        ];


        card.innerHTML =

        questionHeader(q) +

        `

        <p class="instruction">
            Tippe die Begriffe nacheinander
            in der richtigen Reihenfolge an.
        </p>

        <div
            class="word-pool"
            id="wordPool">

            ${words.map(word=>

                `<button class="word">
                    ${word}
                </button>`

            ).join("")}

        </div>


        <div class="sequence-box">

            <div class="sequence-title">
                Deine Reihenfolge
            </div>

            <div
                class="sequence"
                id="sequence">

                Noch nichts ausgewählt

            </div>

        </div>


        <div class="button-row">

            <button
                class="action"
                id="checkOrder">

                Überprüfen

            </button>

            <button
                class="action secondary"
                id="clearOrder">

                Zurücksetzen

            </button>

        </div>

        <div
            class="feedback"
            id="feedback">
        </div>

        `;


        let selected = [];


        const sequence =
        document.getElementById("sequence");


        document
        .querySelectorAll(".word")
        .forEach(button=>{

            button.addEventListener("click",()=>{

                if(answered ||
                   button.classList.contains("used"))
                   return;


                selected.push(
                    button.textContent.trim()
                );


                button.classList.add("used");


                sequence.textContent =
                selected.join("  →  ");

            });

        });


        document
        .getElementById("clearOrder")
        .addEventListener("click",()=>{

            if(answered) return;

            selected = [];

            sequence.textContent =
            "Noch nichts ausgewählt";


            document
            .querySelectorAll(".word")
            .forEach(button=>
                button.classList.remove("used")
            );

        });


        document
        .getElementById("checkOrder")
        .addEventListener("click",()=>{

            if(answered) return;


            if(selected.length !== 4){

                document
                .getElementById("feedback")
                .innerHTML =
                "<p>Wähle zuerst alle vier Schritte aus.</p>";

                return;

            }


            const correctOrder = [

                "Bestäubung",

                "Befruchtung",

                "Neue Merkmalskombinationen",

                "Aussaat"

            ];


            const correct =
            selected.every(
                (word,index)=>
                word === correctOrder[index]
            );


            if(correct){

                score++;
                scoreElement.textContent = score;

            }


            showFeedback(
                correct,
                q.explanation
            );

        });

    }

}


function showFeedback(correct,text){

    answered = true;

    next.disabled = false;


    const feedback =
    document.getElementById("feedback");


    feedback.innerHTML = `

        <div class="
            feedback-box
            ${correct
            ? "feedback-correct"
            : "feedback-wrong"}">

            <div class="feedback-title">

                ${correct
                ? "✓ Richtig!"
                : "Noch nicht ganz."}

            </div>

            ${text}

        </div>

    `;

}


next.addEventListener("click",()=>{

    if(!answered) return;


    current++;


    if(current < questions.length){

        renderQuestion();

    } else {

        showResult();

    }

});


function showResult(){

    progress.style.width = "100%";

    progressText.textContent =
    "Geschafft!";

    next.disabled = true;


    let message;


    if(score === 7){

        message =
        "Klasse! Du hast alle Aufgaben richtig gelöst.";

    } else if(score >= 5){

        message =
        "Sehr gut! Die wichtigsten Zusammenhänge hast du verstanden.";

    } else {

        message =
        "Schau dir die Merksätze noch einmal an und starte danach eine neue Runde.";

    }


    card.innerHTML = `

        <div class="finish">

            <div class="finish-circle">
                ✓
            </div>

            <h2>
                Training geschafft!
            </h2>

            <div class="final-score">
                ${score} / 7
            </div>

            <p>
                ${message}
            </p>


            <div class="merksatz">

                <div class="merksatz-label">
                    DAS SOLLTEST DU DIR MERKEN
                </div>

                Bei der Befruchtung werden die
                <strong>Erbinformationen beider Eltern</strong>
                neu kombiniert.

                Dadurch können
                <strong>neue Merkmalskombinationen</strong>
                entstehen.

            </div>

        </div>

    `;

}


restart.addEventListener("click",()=>{

    current = 0;
    score = 0;
    answered = false;

    scoreElement.textContent = "0";

    renderQuestion();

});


renderQuestion();

</script>

</body>
</html>
