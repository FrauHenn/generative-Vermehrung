<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wie werden Merkmale weitergegeben?</title>

<style>
    * {
        box-sizing: border-box;
    }

    html {
        -webkit-text-size-adjust: 100%;
    }

    body {
        margin: 0;
        padding: 18px;
        font-family: Arial, Helvetica, sans-serif;
        background: #fffaf7;
        color: #3f3a38;
    }

    button,
    input {
        font: inherit;
    }

    .app {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;
    }

    /* KOPF */

    .hero {
        position: relative;
        overflow: hidden;
        padding: 22px 24px;
        border-radius: 22px;
        background: linear-gradient(135deg, #f5cfd2, #f8e2d5);
        box-shadow: 0 4px 15px rgba(80, 50, 45, 0.06);
    }

    .hero::after {
        content: "";
        position: absolute;
        width: 180px;
        height: 180px;
        right: -60px;
        top: -80px;
        border-radius: 50%;
        background: rgba(255,255,255,.25);
    }

    .small-title {
        position: relative;
        z-index: 1;
        color: #8b6465;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.4px;
        text-transform: uppercase;
    }

    h1 {
        position: relative;
        z-index: 1;
        margin: 6px 0 5px;
        color: #553f40;
        font-size: 28px;
        line-height: 1.15;
    }

    .subtitle {
        position: relative;
        z-index: 1;
        margin: 0;
        font-size: 15px;
        line-height: 1.4;
    }

    /* PUNKTE + FORTSCHRITT */

    .status {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 18px;
        margin-top: 17px;
    }

    .score-box {
        min-width: 105px;
        padding: 9px 14px;
        border-radius: 14px;
        background: rgba(255,255,255,.9);
        text-align: center;
    }

    .score-label {
        display: block;
        color: #8b7770;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1px;
    }

    .score {
        color: #674d4e;
        font-size: 22px;
        font-weight: 800;
    }

    .progress-area {
        flex: 1;
        min-width: 0;
    }

    .progress-text {
        margin-bottom: 6px;
        color: #745d59;
        font-size: 12px;
        font-weight: 700;
    }

    .progress-background {
        height: 9px;
        overflow: hidden;
        border-radius: 20px;
        background: rgba(255,255,255,.65);
    }

    .progress-bar {
        width: 0;
        height: 100%;
        border-radius: 20px;
        background: #b87880;
        transition: width .3s ease;
    }

    /* AUFGABENKARTE */

    .card {
        margin-top: 14px;
        padding: 24px;
        border: 1px solid #eaded8;
        border-radius: 22px;
        background: white;
        box-shadow: 0 6px 20px rgba(80,55,45,.06);
    }

    .badge {
        display: inline-block;
        padding: 6px 11px;
        border-radius: 20px;
        background: #f6e6de;
        color: #80625c;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .5px;
        text-transform: uppercase;
    }

    .question {
        margin: 16px 0 18px;
        color: #453936;
        font-size: 21px;
        line-height: 1.3;
    }

    /* ANTWORTEN */

    .answers {
        display: grid;
        gap: 10px;
    }

    .answer {
        display: flex;
        align-items: center;
        width: 100%;
        min-height: 54px;
        padding: 10px 14px;
        border: 2px solid #eee4df;
        border-radius: 14px;
        background: #fffdfc;
        color: #403936;
        text-align: left;
        cursor: pointer;
        touch-action: manipulation;
        transition: .15s;
    }

    .answer:hover {
        border-color: #d7aaa8;
        background: #fff8f5;
    }

    .answer:active {
        transform: scale(.99);
    }

    .letter {
        display: flex;
        flex: 0 0 31px;
        align-items: center;
        justify-content: center;
        width: 31px;
        height: 31px;
        margin-right: 12px;
        border-radius: 50%;
        background: #f4e5df;
        color: #745a55;
        font-size: 13px;
        font-weight: 800;
    }

    .answer.correct {
        border-color: #73a984;
        background: #edf8f0;
    }

    .answer.correct .letter {
        background: #73a984;
        color: white;
    }

    .answer.wrong {
        border-color: #d78780;
        background: #fff0ee;
    }

    .answer.wrong .letter {
        background: #d78780;
        color: white;
    }

    .answer:disabled {
        cursor: default;
        opacity: 1;
    }

    /* FEEDBACK */

    .feedback {
        margin-top: 13px;
    }

    .feedback-box {
        padding: 13px 15px;
        border-radius: 13px;
        font-size: 14px;
        line-height: 1.4;
    }

    .feedback-box.correct {
        border-left: 5px solid #70a982;
        background: #edf8f0;
    }

    .feedback-box.wrong {
        border-left: 5px solid #d88982;
        background: #fff2ef;
    }

    .feedback-title {
        margin-bottom: 3px;
        font-weight: 800;
    }

    /* LÜCKENTEXT */

    .fill-box {
        padding: 17px;
        border-radius: 14px;
        background: #fbf3ed;
        font-size: 17px;
        line-height: 2.1;
    }

    .fill-box input {
        width: 190px;
        max-width: 100%;
        padding: 8px 10px;
        border: 2px solid #d9c0b7;
        border-radius: 9px;
        background: white;
        font-size: 16px;
        outline: none;
    }

    .fill-box input:focus {
        border-color: #b87880;
    }

    /* REIHENFOLGE */

    .instruction {
        margin: -5px 0 13px;
        color: #74645f;
        font-size: 14px;
    }

    .word-pool {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
    }

    .word {
        min-height: 45px;
        padding: 9px 14px;
        border: 2px solid #e3d1c8;
        border-radius: 12px;
        background: #fbf3ed;
        color: #493d39;
        cursor: pointer;
        touch-action: manipulation;
    }

    .word:hover {
        background: #f4e3da;
    }

    .word.used {
        opacity: .35;
        cursor: default;
    }

    .sequence-box {
        margin-top: 15px;
        padding: 14px;
        border-radius: 13px;
        background: #f7f3ec;
    }

    .sequence-label {
        color: #8b7770;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1px;
    }

    .sequence {
        min-height: 22px;
        margin-top: 6px;
        font-size: 14px;
        font-weight: 700;
        line-height: 1.5;
    }

    /* BUTTONS */

    .button-row {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
        margin-top: 14px;
    }

    .action-button,
    .nav-button {
        min-height: 45px;
        border: 0;
        border-radius: 12px;
        padding: 10px 18px;
        font-weight: 700;
        cursor: pointer;
        touch-action: manipulation;
    }

    .action-button {
        background: #b87880;
        color: white;
    }

    .secondary {
        background: #f0e5df;
        color: #614d47;
    }

    .navigation {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-top: 13px;
    }

    .restart {
        background: #eee6e1;
        color: #604e48;
    }

    .next {
        min-width: 130px;
        background: #b87880;
        color: white;
    }

    .next:disabled {
        opacity: .35;
        cursor: not-allowed;
    }

    /* ABSCHLUSS */

    .finish {
        padding: 10px 5px;
        text-align: center;
    }

    .finish-icon {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 68px;
        height: 68px;
        margin: auto;
        border-radius: 50%;
        background: #e7f3e9;
        color: #59866a;
        font-size: 34px;
        font-weight: 800;
    }

    .finish h2 {
        margin: 12px 0 5px;
    }

    .final-score {
        margin: 8px 0;
        color: #684d4e;
        font-size: 38px;
        font-weight: 800;
    }

    .memory-box {
        margin-top: 20px;
        padding: 16px;
        border-radius: 14px;
        background: #f8eee7;
        text-align: left;
        line-height: 1.5;
    }

    .memory-title {
        margin-bottom: 5px;
        color: #8a6b63;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1px;
    }

    /* IPAD QUERFORMAT */

    @media (min-width: 700px) and (max-width: 1200px) and (orientation: landscape) {

        body {
            padding: 10px 14px;
        }

        .hero {
            padding: 15px 20px;
        }

        h1 {
            font-size: 24px;
        }

        .subtitle {
            font-size: 13px;
        }

        .status {
            margin-top: 10px;
        }

        .card {
            margin-top: 10px;
            padding: 18px 20px;
        }

        .question {
            margin: 11px 0 13px;
            font-size: 19px;
        }

        .answers {
            grid-template-columns: 1fr 1fr;
            gap: 8px 10px;
        }

        .answer {
            min-height: 49px;
            font-size: 14px;
        }

        .navigation {
            margin-top: 9px;
        }
    }

    /* IPAD HOCHFORMAT */

    @media (min-width: 600px) and (max-width: 900px) and (orientation: portrait) {

        body {
            padding: 12px;
        }

        .hero {
            padding: 18px;
        }

        h1 {
            font-size: 25px;
        }

        .card {
            padding: 20px;
        }
    }

    /* HANDY / KLEINE FENSTER */

    @media (max-width: 599px) {

        body {
            padding: 8px;
        }

        .hero,
        .card {
            border-radius: 17px;
        }

        .hero {
            padding: 16px;
        }

        h1 {
            font-size: 22px;
        }

        .status {
            gap: 10px;
        }

        .score-box {
            min-width: 85px;
        }

        .card {
            padding: 17px;
        }

        .question {
            font-size: 18px;
        }

        .navigation {
            margin-bottom: 15px;
        }
    }
</style>
</head>

<body>

<div class="app">

    <header class="hero">

        <div class="small-title">
            Biologie · Übung
        </div>

        <h1>Wie werden Merkmale weitergegeben?</h1>

        <p class="subtitle">
            Auch dein Gehirn braucht Training –
            mit jeder Übung wirst du stärker!
        </p>

        <div class="status">

            <div class="score-box">
                <span class="score-label">Punkte</span>

                <div class="score">
                    <span id="score">0</span> / 7
                </div>
            </div>

            <div class="progress-area">

                <div
                    class="progress-text"
                    id="progressText">
                    Aufgabe 1 von 7
                </div>

                <div class="progress-background">
                    <div
                        class="progress-bar"
                        id="progressBar">
                    </div>
                </div>

            </div>

        </div>

    </header>


    <main
        class="card"
        id="card">
    </main>


    <div class="navigation">

        <button
            type="button"
            class="nav-button restart"
            id="restartButton">

            ↻ Neu starten

        </button>

        <button
            type="button"
            class="nav-button next"
            id="nextButton"
            disabled>

            Weiter →

        </button>

    </div>

</div>


<script>

/* ==========================================
   AUFGABEN
========================================== */

const questions = [

    {
        type: "choice",
        category: "Grundwissen",

        question:
            "Was ist ein Gen?",

        answers: [
            "Ein Abschnitt der Erbsubstanz",
            "Eine ganze Zelle",
            "Ein sichtbares Merkmal",
            "Eine Keimzelle"
        ],

        correct: 0,

        explanation:
            "Ein Gen ist ein Abschnitt der Erbsubstanz."
    },


    {
        type: "fill",
        category: "Erbinformation",

        question:
            "Vervollständige den Merksatz.",

        explanation:
            "Gene enthalten die Erbinformation für bestimmte Merkmale."
    },


    {
        type: "choice",
        category: "Bestäubung",

        question:
            "Welcher Vorgang findet zuerst statt?",

        answers: [
            "Befruchtung",
            "Bestäubung",
            "Aussaat",
            "Neukombination"
        ],

        correct: 1,

        explanation:
            "Zuerst erfolgt die Bestäubung. Danach kann es zur Befruchtung kommen."
    },


    {
        type: "choice",
        category: "Befruchtung",

        question:
            "Was passiert bei der Befruchtung?",

        answers: [
            "Zwei Blüten verschmelzen.",
            "Männliche und weibliche Keimzelle verschmelzen.",
            "Zwei Erbsen werden miteinander vermischt.",
            "Die Erbinformation geht verloren."
        ],

        correct: 1,

        explanation:
            "Bei der Befruchtung verschmelzen männliche und weibliche Keimzelle."
    },


    {
        type: "sort",
        category: "Reihenfolge",

        question:
            "Bringe die Vorgänge in die richtige Reihenfolge.",

        explanation:
            "Bestäubung → Befruchtung → neue Merkmalskombinationen → Aussaat"
    },


    {
        type: "choice",
        category: "Denkaufgabe",

        question:
            "Warum können Nachkommen neue Merkmalskombinationen besitzen?",

        answers: [

            "Weil bei der Befruchtung die Erbinformationen beider Eltern neu kombiniert werden.",

            "Weil sich die Merkmale bei der Aussaat zufällig verändern.",

            "Weil nur ein Elternteil seine Erbinformation weitergibt.",

            "Weil bei der Bestäubung neue Gene entstehen."
        ],

        correct: 0,

        explanation:
            "Bei der Befruchtung werden die Erbinformationen beider Eltern neu kombiniert. Dadurch können neue Merkmalskombinationen entstehen."
    },


    {
        type: "choice",
        category: "Zum Schluss",

        question:
            "Warum können sich Nachkommen von ihren Eltern unterscheiden?",

        answers: [

            "Weil alle Nachkommen genau dieselbe Erbinformation erhalten.",

            "Weil die Erbinformationen beider Eltern neu kombiniert werden.",

            "Weil nur die Umwelt die Merkmale bestimmt.",

            "Weil bei jeder Aussaat automatisch neue Gene entstehen."
        ],

        correct: 1,

        explanation:
            "Durch die Neukombination der Erbinformationen beider Eltern können neue Merkmalskombinationen entstehen."
    }

];


/* ==========================================
   VARIABLEN
========================================== */

let currentQuestion = 0;
let score = 0;
let answered = false;


const card =
    document.getElementById("card");

const scoreDisplay =
    document.getElementById("score");

const progressText =
    document.getElementById("progressText");

const progressBar =
    document.getElementById("progressBar");

const nextButton =
    document.getElementById("nextButton");

const restartButton =
    document.getElementById("restartButton");


/* ==========================================
   FORTSCHRITT
========================================== */

function updateProgress() {

    progressText.textContent =
        "Aufgabe " +
        (currentQuestion + 1) +
        " von " +
        questions.length;

    const percentage =
        ((currentQuestion + 1) /
        questions.length) * 100;

    progressBar.style.width =
        percentage + "%";
}


/* ==========================================
   AUFGABENKOPF
========================================== */

function createHeader(question) {

    return `

        <div class="badge">
            Aufgabe ${currentQuestion + 1}
            ·
            ${question.category}
        </div>

        <h2 class="question">
            ${question.question}
        </h2>

    `;
}


/* ==========================================
   AUFGABE ANZEIGEN
========================================== */

function showQuestion() {

    answered = false;
    nextButton.disabled = true;

    updateProgress();

    const question =
        questions[currentQuestion];


    if (question.type === "choice") {

        showChoiceQuestion(question);

    }

    else if (question.type === "fill") {

        showFillQuestion(question);

    }

    else if (question.type === "sort") {

        showSortQuestion(question);

    }
}


/* ==========================================
   MULTIPLE CHOICE
========================================== */

function showChoiceQuestion(question) {

    let html =
        createHeader(question);

    html += `<div class="answers">`;


    question.answers.forEach(
        function(answer, index) {

            const letter =
                String.fromCharCode(65 + index);

            html += `

                <button
                    type="button"
                    class="answer"
                    data-index="${index}">

                    <span class="letter">
                        ${letter}
                    </span>

                    <span>
                        ${answer}
                    </span>

                </button>

            `;
        }
    );


    html += `

        </div>

        <div
            class="feedback"
            id="feedback">
        </div>

    `;


    card.innerHTML = html;


    const answerButtons =
        card.querySelectorAll(".answer");


    answerButtons.forEach(
        function(button) {

            button.addEventListener(
                "click",
                function() {

                    if (answered) {
                        return;
                    }


                    const selected =
                        Number(
                            button.dataset.index
                        );


                    const isCorrect =
                        selected ===
                        question.correct;


                    answerButtons.forEach(
                        function(btn) {
                            btn.disabled = true;
                        }
                    );


                    if (isCorrect) {

                        button.classList.add(
                            "correct"
                        );

                        addPoint();

                    }

                    else {

                        button.classList.add(
                            "wrong"
                        );

                        answerButtons[
                            question.correct
                        ].classList.add(
                            "correct"
                        );

                    }


                    showFeedback(
                        isCorrect,
                        question.explanation
                    );

                }
            );

        }
    );
}


/* ==========================================
   LÜCKENTEXT
========================================== */

function showFillQuestion(question) {

    card.innerHTML =

        createHeader(question) +

        `

        <div class="fill-box">

            Gene enthalten die

            <input
                type="text"
                id="fillInput"
                autocomplete="off"
                placeholder="Begriff">

            für bestimmte Merkmale.

        </div>


        <div class="button-row">

            <button
                type="button"
                class="action-button"
                id="checkFill">

                Überprüfen

            </button>

        </div>


        <div
            class="feedback"
            id="feedback">
        </div>

        `;


    const input =
        document.getElementById(
            "fillInput"
        );


    const checkButton =
        document.getElementById(
            "checkFill"
        );


    checkButton.addEventListener(
        "click",
        checkFillAnswer
    );


    input.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                event.preventDefault();

                checkFillAnswer();

            }

        }
    );


    function checkFillAnswer() {

        if (answered) {
            return;
        }


        const value =
            input.value
            .trim()
            .toLowerCase();


        if (value === "") {

            document
            .getElementById("feedback")
            .innerHTML =

            `<div class="feedback-box wrong">
                Bitte trage zuerst einen Begriff ein.
            </div>`;

            return;
        }


        const isCorrect =
            value === "erbinformation" ||
            value === "erbinformationen";


        if (isCorrect) {

            addPoint();

        }


        input.disabled = true;
        checkButton.disabled = true;


        showFeedback(
            isCorrect,
            question.explanation
        );

    }
}


/* ==========================================
   REIHENFOLGE
========================================== */

function showSortQuestion(question) {

    const words = [

        "Aussaat",

        "Befruchtung",

        "Neue Merkmalskombinationen",

        "Bestäubung"

    ];


    let selectedWords = [];


    card.innerHTML =

        createHeader(question) +

        `

        <p class="instruction">
            Tippe die Begriffe nacheinander
            in der richtigen Reihenfolge an.
        </p>


        <div
            class="word-pool"
            id="wordPool">

            ${words.map(

                function(word) {

                    return `

                        <button
                            type="button"
                            class="word">

                            ${word}

                        </button>

                    `;

                }

            ).join("")}

        </div>


        <div class="sequence-box">

            <div class="sequence-label">
                Deine Reihenfolge
            </div>

            <div
                class="sequence"
                id="sequence">

                Noch nichts ausgewählt

            </div>

        </div>


        <div class="button-row">

            <button
                type="button"
                class="action-button"
                id="checkOrder">

                Überprüfen

            </button>


            <button
                type="button"
                class="action-button secondary"
                id="clearOrder">

                Zurücksetzen

            </button>

        </div>


        <div
            class="feedback"
            id="feedback">
        </div>

        `;


    const sequence =
        document.getElementById(
            "sequence"
        );


    const wordButtons =
        card.querySelectorAll(".word");


    wordButtons.forEach(
        function(button) {

            button.addEventListener(
                "click",
                function() {

                    if (
                        answered ||
                        button.classList.contains(
                            "used"
                        )
                    ) {
                        return;
                    }


                    const word =
                        button.textContent.trim();


                    selectedWords.push(word);


                    button.classList.add(
                        "used"
                    );


                    updateSequence();

                }
            );

        }
    );


    function updateSequence() {

        if (
            selectedWords.length === 0
        ) {

            sequence.textContent =
                "Noch nichts ausgewählt";

        }

        else {

            sequence.textContent =
                selectedWords.join(
                    "  →  "
                );

        }

    }


    document
    .getElementById("clearOrder")
    .addEventListener(
        "click",
        function() {

            if (answered) {
                return;
            }


            selectedWords = [];


            wordButtons.forEach(
                function(button) {

                    button.classList.remove(
                        "used"
                    );

                }
            );


            updateSequence();

        }
    );


    document
    .getElementById("checkOrder")
    .addEventListener(
        "click",
        function() {

            if (answered) {
                return;
            }


            if (
                selectedWords.length !== 4
            ) {

                document
                .getElementById("feedback")
                .innerHTML =

                `<div class="feedback-box wrong">
                    Wähle zuerst alle vier Schritte aus.
                </div>`;

                return;
            }


            const correctOrder = [

                "Bestäubung",

                "Befruchtung",

                "Neue Merkmalskombinationen",

                "Aussaat"

            ];


            const isCorrect =
                selectedWords.every(
                    function(word, index) {

                        return (
                            word ===
                            correctOrder[index]
                        );

                    }
                );


            if (isCorrect) {

                addPoint();

            }


            wordButtons.forEach(
                function(button) {
                    button.disabled = true;
                }
            );


            showFeedback(
                isCorrect,
                question.explanation
            );

        }
    );
}


/* ==========================================
   PUNKT
========================================== */

function addPoint() {

    score++;

    scoreDisplay.textContent =
        score;
}


/* ==========================================
   FEEDBACK
========================================== */

function showFeedback(
    isCorrect,
    explanation
) {

    answered = true;

    nextButton.disabled = false;


    const feedback =
        document.getElementById(
            "feedback"
        );


    if (isCorrect) {

        feedback.innerHTML = `

            <div
                class="feedback-box correct">

                <div class="feedback-title">
                    ✓ Richtig!
                </div>

                ${explanation}

            </div>

        `;

    }

    else {

        feedback.innerHTML = `

            <div
                class="feedback-box wrong">

                <div class="feedback-title">
                    Noch nicht ganz.
                </div>

                ${explanation}

            </div>

        `;

    }
}


/* ==========================================
   WEITER
========================================== */

nextButton.addEventListener(
    "click",
    function() {

        if (!answered) {
            return;
        }


        currentQuestion++;


        if (
            currentQuestion <
            questions.length
        ) {

            showQuestion();

        }

        else {

            showResult();

        }

    }
);


/* ==========================================
   ERGEBNIS
========================================== */

function showResult() {

    progressText.textContent =
        "Geschafft!";

    progressBar.style.width =
        "100%";

    nextButton.style.display =
        "none";


    let message = "";


    if (score === 7) {

        message =
            "Super! Du hast alle Aufgaben richtig gelöst.";

    }

    else if (score >= 5) {

        message =
            "Sehr gut! Du hast die wichtigsten Zusammenhänge verstanden.";

    }

    else if (score >= 3) {

        message =
            "Schon ganz gut! Schau dir die Erklärungen noch einmal genau an.";

    }

    else {

        message =
            "Übe die wichtigsten Begriffe noch einmal und starte danach eine neue Runde.";

    }


    card.innerHTML = `

        <div class="finish">

            <div class="finish-icon">
                ✓
            </div>

            <h2>
                Training geschafft!
            </h2>

            <div class="final-score">
                ${score} / 7
            </div>

            <p>
                ${message}
            </p>


            <div class="memory-box">

                <div class="memory-title">
                    DAS SOLLTEST DU DIR MERKEN
                </div>

                Bei der
                <strong>Befruchtung</strong>
                verschmelzen männliche und
                weibliche Keimzelle.

                Dabei werden die
                <strong>
                    Erbinformationen beider Eltern
                </strong>
                neu kombiniert.

                So können
                <strong>
                    neue Merkmalskombinationen
                </strong>
                entstehen.

            </div>

        </div>

    `;
}


/* ==========================================
   NEU STARTEN
========================================== */

restartButton.addEventListener(
    "click",
    function() {

        currentQuestion = 0;
        score = 0;
        answered = false;

        scoreDisplay.textContent =
            "0";

        nextButton.style.display =
            "block";

        showQuestion();

    }
);


/* ==========================================
   START
========================================== */

showQuestion();

</script>

</body>
</html>
